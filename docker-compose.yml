services:
  ruby-app:
    build: ./ruby-app
    container_name: ruby-app
    ports:
      - "4567:4567"
    environment:
      - OTEL_SERVICE_NAME=ruby-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_TRACES_EXPORTER=otlp
    depends_on:
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      ruby-app:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./monitoring/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    depends_on:
      - ruby-app
    networks:
      - app-network

  mimir:
    image: grafana/mimir:2.13.0
    container_name: mimir
    ports:
      - "9009:9009"
      - "9095:9095"
    volumes:
      - ./monitoring/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data:/data/mimir
    command: --config.file=/etc/mimir/mimir.yml
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: --config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    user: "0"
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    command: --config.file=/etc/tempo/tempo.yml
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - mimir
      - loki
      - tempo
    networks:
      - app-network
  
  alloy:
    image: grafana/alloy:v1.4.2
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - app-network

  alert-receiver:
    image: python:3.12-alpine
    container_name: alert-receiver
    volumes:
      - ./monitoring/alert-receiver.py:/app/receiver.py:ro
    command: ["python", "/app/receiver.py"]
    networks:
      - app-network

volumes:
  prometheus_data:
  mimir_data:
  loki_data:
  tempo_data:
  grafana_data:
  alloy_data:

networks:
  app-network:
    driver: bridge
